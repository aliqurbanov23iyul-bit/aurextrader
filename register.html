<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — Nexora</title><link rel="stylesheet" href="assets/style.css"></head><body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brandmark">N</span>Nexora <em>Markets</em></a><form class="card auth" id="form"><span class="eyebrow">CREATE ACCOUNT</span><h1>Demo hesab yarat</h1><label>Ad Soyad</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Şifrə</label><input id="password" type="password" minlength="8" required><button class="btn primary full">Qeydiyyat</button><div id="msg"></div></form><script src="assets/api.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{let x=await API.call('/api/auth?mode=register',{method:'POST',body:JSON.stringify({name:name.value,email:email.value,password:password.value})});API.save(x);msg.innerHTML='<div class="notice">Account ID: <b>'+x.user.account_id+'</b></div>';setTimeout(()=>location.href='dashboard.html',700)}catch(er){msg.innerHTML='<div class="notice error">'+er.message+'</div>'}}</script></body></html>

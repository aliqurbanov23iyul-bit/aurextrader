<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdrawal — Nexora</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="nav"><a class="brand" href="index.html"><span class="brandmark">N</span>Nexora <em>Markets</em></a><nav><a href="markets.html">Markets</a><a href="trade.html">Trade</a><a href="about.html">Haqqımızda</a><a href="support.html">Dəstək</a></nav><div class="nav-actions"><a class="btn ghost" href="login.html">Giriş</a><a class="btn primary" href="register.html">Qeydiyyat</a></div></header><main class="section" style="max-width:760px"><span class="eyebrow">WITHDRAWAL REQUEST</span><h2>Çıxarış sorğusu</h2><p class="muted">Demo sistem real pul göndərmir. CVV, PIN, OTP və bank şifrəsi tələb edilmir.</p><section class="panel"><label>Üsul</label><div class="method-grid"><button class="method active" data-m="m10"><span class="paylogo m10">m10</span>m10</button><button class="method" data-m="birbank"><span class="paylogo bir">B</span>Birbank</button><button class="method" data-m="visa"><span class="paylogo visa">VISA</span>Visa</button><button class="method" data-m="mastercard"><span class="paylogo mc">●●</span>Mastercard</button></div><label id="destLabel">m10 telefon nömrəsi</label><input id="dest" placeholder="+994 XX XXX XX XX"><label>Məbləğ (USDT)</label><input id="amount" type="number" min="1" placeholder="100"><button id="send" class="btn primary full">Sorğunu göndər</button><div id="msg"></div></section><section class="panel"><div class="panel-head"><h3>Sorğularım</h3></div><div id="requests"></div></section></main><script src="assets/api.js"></script><script>
let method='m10';document.querySelectorAll('.method').forEach(b=>b.onclick=()=>{document.querySelectorAll('.method').forEach(x=>x.classList.remove('active'));b.classList.add('active');method=b.dataset.m;destLabel.textContent=method==='m10'?'m10 telefon nömrəsi':'Kart / hesab identifikatoru';dest.placeholder=method==='m10'?'+994 XX XXX XX XX':'Məs: •••• 4821'});async function load(){try{let x=await API.call('/api/withdrawals');requests.innerHTML=x.length?x.map(w=>`<div class="request-row"><b>#${w.id} · ${w.method}</b><span>${w.amount} USDT</span><span class="${w.status==='approved'?'up':w.status==='rejected'?'down':''}">${w.status}</span><small>${new Date(w.created_at).toLocaleDateString()}</small></div>`).join(''):'<p class="muted">Sorğu yoxdur.</p>'}catch(e){location.href='login.html'}}send.onclick=async()=>{try{let x=await API.call('/api/withdrawals',{method:'POST',body:JSON.stringify({method,destination:dest.value,amount:Number(amount.value)})});msg.innerHTML='<div class="notice">Sorğu #'+x.id+' yaradıldı.</div>';load()}catch(e){msg.innerHTML='<div class="notice error">'+e.message+'</div>'}};load()
</script></body></html>

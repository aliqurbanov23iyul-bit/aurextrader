<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Nexora</title><link rel="stylesheet" href="assets/style.css"></head><body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brandmark">N</span>Nexora <em>Markets</em></a><form class="card auth" id="form"><span class="eyebrow">WELCOME BACK</span><h1>Giriş et</h1><label>Email</label><input id="email" type="email" required><label>Şifrə</label><input id="password" type="password" required><button class="btn primary full">Giriş et</button><div id="msg"></div><p class="muted">Hesabın yoxdur? <a class="up" href="register.html">Qeydiyyat</a></p></form><script src="assets/api.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{let x=await API.call('/api/auth?mode=login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});API.save(x);location.href=x.user.role==='admin'?'admin.html':'dashboard.html'}catch(er){msg.innerHTML='<div class="notice error">'+er.message+'</div>'}}</script></body></html>
